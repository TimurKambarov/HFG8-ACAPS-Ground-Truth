<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ground Truth - a trusted expert loop for ACAPS risk analysis.">
  <meta name="theme-color" content="#004A7C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ground Truth">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ground Truth · ACAPS</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Loading screen. Everything is inline (no fonts, no images) so it shows
    instantly even on a very slow connection, while the app itself downloads.
    It is removed when Flutter paints its first frame.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #F2F3F4; }
    #gt-splash {
      position: fixed; inset: 0; z-index: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box; text-align: center;
      font-family: "Roboto Condensed", "Arial Narrow", "Segoe UI", Roboto, Arial, sans-serif;
      color: #1D1D1B; background: #F2F3F4;
    }
    #gt-splash svg { width: 56px; height: 72px; }
    #gt-splash h1 {
      margin: 18px 0 4px; font-size: 30px; line-height: 1.05; font-weight: 900;
      letter-spacing: -0.3px; text-transform: uppercase;
    }
    #gt-splash h1 span { color: #007FA3; }
    #gt-splash .bar { width: 112px; height: 4px; margin: 14px auto 18px; background: #D9DEE2; overflow: hidden; }
    #gt-splash .bar i { display: block; width: 40%; height: 100%; background: #0093B7; animation: gt-slide 1.2s ease-in-out infinite; }
    #gt-splash p { margin: 0; max-width: 320px; font-size: 15px; line-height: 1.5; color: #55616B; }
    #gt-splash .slow { display: none; margin-top: 10px; }
    #gt-splash.is-slow .slow { display: block; }
    @keyframes gt-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #gt-splash .bar i { animation: none; width: 100%; } }
    @media (prefers-color-scheme: dark) {
      html, body, #gt-splash { background: #0A1724; color: #E6EEF4; }
      #gt-splash h1 span { color: #4CC6E6; }
      #gt-splash .bar { background: #26425E; }
      #gt-splash .bar i { background: #4CC6E6; }
      #gt-splash p { color: #A3B6C7; }
      #gt-splash .dot { fill: #E6EEF4; }
    }
  </style>
</head>
<body>
  <div id="gt-splash" role="status" aria-live="polite">
    <svg viewBox="0 0 56 72" aria-hidden="true">
      <path d="M28 2C13.6 2 2 13.6 2 28c0 17 26 42 26 42s26-25 26-42C54 13.6 42.4 2 28 2zm0 40a14 14 0 1 1 0-28 14 14 0 0 1 0 28z" fill="#0093B7"/>
      <circle class="dot" cx="28" cy="28" r="8" fill="#1D1D1B"/>
    </svg>
    <h1>Ground <span>Truth</span></h1>
    <div class="bar"><i></i></div>
    <p>Loading the ACAPS expert network…</p>
    <p class="slow">Slow connection. The app is still loading, this happens only the first time — please keep this page open.</p>
    <noscript><p>Please enable JavaScript to use Ground Truth.</p></noscript>
  </div>
  <script>
    (function () {
      var s = document.getElementById('gt-splash');
      var t = setTimeout(function () { s && s.classList.add('is-slow'); }, 6000);
      window.addEventListener('flutter-first-frame', function () {
        clearTimeout(t);
        if (s && s.parentNode) s.parentNode.removeChild(s);
      }, { once: true });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
