<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ground Truth - a trusted expert loop for ACAPS risk analysis.">
  <meta name="theme-color" content="#004B78">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ground Truth">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ground Truth · ACAPS</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Loading screen. Everything is inline (no fonts, no images) so it shows
    instantly even on a very slow connection, while the app itself downloads.
    It is removed when Flutter paints its first frame.
  -->
  <style>
    /* ACAPS navy band, as on acaps.org and the app's first screen. */
    html, body { margin: 0; height: 100%; background: #004B78; }
    #gt-splash {
      position: fixed; inset: 0; z-index: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box; text-align: center;
      font-family: "Roboto Condensed", "Arial Narrow", "Segoe UI", Roboto, Arial, sans-serif;
      color: #FFFFFF; background: #004B78;
    }
    #gt-splash svg { width: 56px; height: 67px; }
    #gt-splash h1 {
      margin: 18px 0 4px; font-size: 34px; line-height: 1.05; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      font-family: "Bebas Neue", "Roboto Condensed", "Arial Narrow", Arial, sans-serif;
    }
    #gt-splash h1 span { color: #3DB8D8; }
    #gt-splash .bar { width: 112px; height: 3px; margin: 14px auto 18px; background: rgba(255,255,255,.18); overflow: hidden; }
    #gt-splash .bar i { display: block; width: 40%; height: 100%; background: #3DB8D8; animation: gt-slide 1.2s ease-in-out infinite; }
    #gt-splash p { margin: 0; max-width: 320px; font-size: 15px; line-height: 1.5; color: rgba(255,255,255,.85); }
    #gt-splash .slow { display: none; margin-top: 10px; }
    #gt-splash.is-slow .slow { display: block; }
    @keyframes gt-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #gt-splash .bar i { animation: none; width: 100%; } }
    @media (prefers-color-scheme: dark) {
      html, body, #gt-splash { background: #032B45; }
    }
  </style>
</head>
<body>
  <div id="gt-splash" role="status" aria-live="polite">
    <svg viewBox="0 0 90 108" aria-hidden="true">
      <path fill-rule="evenodd" d="M45 108 13.5 77.1A45 45 0 1 1 76.5 77.1ZM45 14a31 31 0 1 0 0 62 31 31 0 0 0 0-62Z" fill="#3DB8D8"/>
      <circle cx="45" cy="45" r="17" fill="#FFFFFF"/>
    </svg>
    <h1>Ground <span>Truth</span></h1>
    <div class="bar"><i></i></div>
    <p>Loading the ACAPS expert network…</p>
    <p class="slow">Slow connection. The app is still loading, this happens only the first time — please keep this page open.</p>
    <noscript><p>Please enable JavaScript to use Ground Truth.</p></noscript>
  </div>
  <script>
    (function () {
      var s = document.getElementById('gt-splash');
      var t = setTimeout(function () { s && s.classList.add('is-slow'); }, 6000);
      window.addEventListener('flutter-first-frame', function () {
        clearTimeout(t);
        if (s && s.parentNode) s.parentNode.removeChild(s);
      }, { once: true });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
