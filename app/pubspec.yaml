name: ground_truth
description: Ground Truth - a trusted expert loop for ACAPS risk analysis (Hackathon for Good #8 prototype).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.6
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/risk-radar-export.csv
  # The two typefaces of acaps.org, Latin subsets (~120 KB): bundled, so the
  # app never fetches fonts over a weak connection. See assets/fonts/README.md.
  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/RobotoCondensed-Regular.ttf
        - asset: assets/fonts/RobotoCondensed-Bold.ttf
          weight: 700
    # Arrows (← ↑ → ↓) only, ~2 KB: missing from the Latin subsets above.
    - family: Arrows
      fonts:
        - asset: assets/fonts/Arrows-400.ttf
        - asset: assets/fonts/Arrows-700.ttf
          weight: 700
