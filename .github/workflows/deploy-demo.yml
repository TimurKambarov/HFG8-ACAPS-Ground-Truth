# Live demo: builds the Flutter web app in app/ and publishes it on GitHub Pages
# at https://<owner>.github.io/HFG8-ACAPS-Ground-Truth/ on every push to main.
#
# On a computer the page shows the app inside a phone frame, at phone size; on
# a phone it fills the screen (see app/web/index.html).
#
# The demo uses the project's Supabase, like run.ps1: real accounts, invite
# and referral codes, and the ACAPS risks from the `risks` table.
#
# One-time setup by the repository owner:
#   1. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#   2. Settings -> Secrets and variables -> Actions -> New repository secret:
#        SUPABASE_URL              (the same value as in API.key)
#        SUPABASE_PUBLISHABLE_KEY  (the same value as in API.key)
#      Only these two. The publishable key is meant to be in the app (row
#      level security protects the data); NEVER add SUPABASE_SECRET_KEY here.
# It can also be started by hand: Actions -> "Deploy live demo" -> Run workflow.

name: Deploy live demo

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/deploy-demo.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      # Pasted secrets often end with a line break, which breaks the build
      # command, so spaces and line breaks are removed (neither value can
      # contain them). The cleaned values go to the next steps as GT_*.
      - name: Check the Supabase secrets
        working-directory: .
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL }}
          RAW_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          url=$(printf '%s' "$RAW_URL" | tr -d '[:space:]')
          key=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::Add the repository secrets SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (see the top of this file)."
            exit 1
          fi
          case "$url" in
            https://*) ;;
            *) echo "::error::SUPABASE_URL must be only the URL, starting with https:// (no 'SUPABASE_URL=' in front)."; exit 1 ;;
          esac
          case "$key" in
            SUPABASE_*) echo "::error::SUPABASE_PUBLISHABLE_KEY must be only the key, without 'SUPABASE_PUBLISHABLE_KEY=' in front."; exit 1 ;;
          esac
          echo "::add-mask::$url"
          echo "::add-mask::$key"
          echo "GT_SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "GT_SUPABASE_KEY=$key" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get

      # Tests never call Supabase (they use test/fixtures/risks.json).
      - run: flutter test

      - name: Build web app
        run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=SUPABASE_URL="$GT_SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$GT_SUPABASE_KEY"

      # Pages serves 404.html for unknown paths: send those to the app too.
      - run: cp build/web/index.html build/web/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
