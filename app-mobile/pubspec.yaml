name: ground_truth
description: Ground Truth - a trusted expert loop for ACAPS risk analysis (Hackathon for Good #8 prototype).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  supabase_flutter: 2.18.3
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # No bundled risks: they come from Supabase (synced from the ACAPS Risk Radar API).
